<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MONI Earth Debug</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/6.0.1/satellite.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#cesiumContainer{width:100%;height:100%;overflow:hidden;background:#02040a}
    body{font-family:Inter,Arial,Helvetica,sans-serif;color:#fff}
    #cesiumContainer{position:fixed;inset:0}
    .cesium-viewer-toolbar,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer{display:none!important}

    :root{
      --panel:rgba(5,8,15,.76);--line:rgba(255,255,255,.09);
      --muted:rgba(255,255,255,.45);--ok:#78f59a;--warn:#ffd36a;
      --bad:#ff7474;--blue:#48a5ff;--cyan:#50e3ff
    }

    #brand{position:fixed;left:24px;top:20px;z-index:50;font-size:13px;font-weight:800;letter-spacing:.20em;pointer-events:none}
    #brand span{font-weight:400;opacity:.45}
    #utcClock{position:fixed;left:24px;top:44px;z-index:50;color:var(--muted);font-size:10px;letter-spacing:.08em;pointer-events:none}

    #topHealth{
      position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;
      display:flex;gap:6px;padding:6px;background:rgba(5,8,15,.66);
      border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(15px)
    }
    .healthChip{min-width:88px;padding:7px 10px;border-radius:7px;background:rgba(255,255,255,.035)}
    .healthName{font-size:8px;color:var(--muted);letter-spacing:.12em}
    .healthState{margin-top:3px;font-size:10px;font-weight:700}
    .ok{color:var(--ok)} .warning{color:var(--warn)} .error{color:var(--bad)} .muted{color:var(--muted)}

    #rightPanel{
      position:fixed;right:20px;top:72px;bottom:22px;width:330px;z-index:45;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      backdrop-filter:blur(18px);overflow:hidden;display:flex;flex-direction:column
    }
    .panelHeader{padding:14px 15px 11px;border-bottom:1px solid var(--line)}
    .panelTitle{font-size:10px;font-weight:800;letter-spacing:.16em}
    .panelSub{font-size:8px;color:var(--muted);margin-top:4px}
    #sourceList{overflow:auto;padding:10px 12px 18px;scrollbar-width:thin}
    .groupTitle{font-size:8px;color:rgba(255,255,255,.34);letter-spacing:.18em;font-weight:800;margin:12px 3px 7px}
    .source{
      padding:10px;border:1px solid transparent;border-radius:8px;margin-bottom:5px;
      background:rgba(255,255,255,.025);cursor:pointer;transition:.15s
    }
    .source:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.07)}
    .sourceTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .sourceName{font-size:11px;font-weight:700}
    .sourceRole{font-size:8px;color:var(--muted);margin-top:3px}
    .sourceState{font-size:8px;font-weight:800;letter-spacing:.08em}
    .sourceMeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:8px;font-size:8px;color:rgba(255,255,255,.36)}
    .sourceMeta strong{font-weight:500;color:rgba(255,255,255,.72)}

    #detailPanel{
      position:fixed;left:22px;bottom:22px;width:330px;z-index:45;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      backdrop-filter:blur(18px);padding:14px;display:none
    }
    #detailPanel.visible{display:block}
    .detailHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    #detailName{font-size:14px;font-weight:800}
    #detailRole{font-size:8px;color:var(--muted);margin-top:4px}
    #detailClose{border:0;background:transparent;color:#fff;opacity:.45;font-size:18px;cursor:pointer}
    #detailStatus{font-size:9px;font-weight:800;margin-top:12px}
    .detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .detailCell{padding:8px;background:rgba(255,255,255,.035);border-radius:7px}
    .detailLabel{font-size:7px;color:var(--muted);letter-spacing:.1em}
    .detailValue{font-size:10px;margin-top:4px;word-break:break-word}
    #detailProducts{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:8px;line-height:1.8;color:rgba(255,255,255,.65)}

    #controls{position:fixed;right:366px;bottom:22px;z-index:45;display:flex;flex-direction:column;gap:7px}
    .controlButton{
      width:42px;height:42px;border:1px solid var(--line);border-radius:8px;
      background:rgba(5,8,15,.65);backdrop-filter:blur(12px);color:#fff;font-size:17px;cursor:pointer
    }
    .controlButton:hover{background:rgba(40,55,80,.82)}

    #legend{
      position:fixed;left:22px;top:75px;z-index:40;padding:10px 12px;
      border:1px solid var(--line);border-radius:9px;background:rgba(5,8,15,.55);
      backdrop-filter:blur(12px);font-size:8px;color:var(--muted);line-height:1.8
    }
    .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
    #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;
      background:rgba(5,8,15,.9);border:1px solid var(--line);border-radius:8px;padding:9px 12px;
      font-size:9px;opacity:0;pointer-events:none;transition:.2s}
    #toast.show{opacity:1}

    @media(max-width:900px){
      #rightPanel{width:290px}
      #topHealth{left:18px;top:70px;transform:none;flex-direction:column}
      .healthChip{min-width:100px}
      #legend{display:none}
      #controls{right:326px}
    }

    /* MOBILE — mesmo conceito da tela principal: mapa livre + painel em gaveta */
    #mobileMenuButton{display:none}
    #mobileBackdrop{display:none}
    @media(max-width:700px){
      #brand{left:14px;top:14px;font-size:11px}
      #utcClock{left:14px;top:34px;font-size:8px}
      #legend{display:none}
      #topHealth{
        top:58px;left:10px;right:10px;transform:none;
        display:flex;overflow-x:auto;gap:5px;padding:5px;max-width:none;
        scrollbar-width:none;
      }
      #topHealth::-webkit-scrollbar{display:none}
      .healthChip{min-width:76px;padding:6px 8px;flex:0 0 auto}
      .healthName{font-size:7px}.healthState{font-size:8px}
      #rightPanel{
        top:0;right:0;bottom:0;width:min(88vw,340px);height:100dvh;
        border-radius:0;border-top:0;border-right:0;border-bottom:0;
        transform:translateX(105%);transition:transform .22s ease;z-index:70;
      }
      body.mobile-panel-open #rightPanel{transform:translateX(0)}
      #mobileBackdrop{
        position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65;
        backdrop-filter:blur(2px);
      }
      body.mobile-panel-open #mobileBackdrop{display:block}
      #mobileMenuButton{
        display:block;position:fixed;right:12px;top:12px;z-index:80;
        width:42px;height:42px;border:1px solid var(--line);border-radius:9px;
        background:rgba(5,8,15,.78);color:#fff;font-size:20px;
        backdrop-filter:blur(14px);
      }
      #detailPanel{
        left:10px;right:10px;bottom:10px;width:auto;max-height:48dvh;overflow:auto;
        padding:12px;z-index:60;
      }
      .detailGrid{gap:6px}.detailCell{padding:7px}
      #controls{right:12px;bottom:12px;gap:6px}
      .controlButton{width:40px;height:40px}
      .panelHeader{padding-top:18px}
      #sourceList{padding-bottom:28px}
    }
  </style>

<style id="moni-standard-layout">
/* =========================================================
   MONI EARTH DEBUG — LAYOUT PADRONIZADO PC + MOBILE
   Fontes: gaveta lateral em ambos
   Status: faixa horizontal em ambos
   ========================================================= */

:root{
  --sources-width: 340px;
  --top-status-height: 58px;
}

/* Status sempre horizontal */
#topHealth{
  position: fixed !important;
  top: 16px !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  transform: translateX(-50%) !important;
  z-index: 70 !important;
  display: flex !important;
  flex-direction: row !important;
  flex-wrap: nowrap !important;
  gap: 6px !important;
  max-width: calc(100vw - 150px) !important;
  overflow-x: auto !important;
  overflow-y: hidden !important;
  scrollbar-width: none;
  white-space: nowrap;
}
#topHealth::-webkit-scrollbar{display:none}
#topHealth .healthChip{flex:0 0 auto !important}

/* Painel de fontes é gaveta lateral em qualquer resolução */
#rightPanel{
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  left: auto !important;
  width: min(var(--sources-width), 88vw) !important;
  max-height: none !important;
  border-radius: 0 !important;
  border-top: 0 !important;
  border-right: 0 !important;
  border-bottom: 0 !important;
  transform: translateX(102%) !important;
  transition: transform .24s ease !important;
  z-index: 90 !important;
}
body.sources-open #rightPanel{
  transform: translateX(0) !important;
}

/* Botão único para Fontes */
#sourcesMenuButton{
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 95;
  height: 40px;
  min-width: 92px;
  padding: 0 13px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 9px;
  background: rgba(5,8,15,.72);
  backdrop-filter: blur(14px);
  color: #fff;
  font: 700 9px/1 Inter,Arial,sans-serif;
  letter-spacing: .11em;
  cursor: pointer;
}
#sourcesMenuButton:hover{background:rgba(35,48,70,.88)}
body.sources-open #sourcesMenuButton{
  right: min(calc(var(--sources-width) + 12px), calc(88vw + 12px));
}

/* Fundo ao abrir a gaveta */
#sourcesBackdrop{
  position: fixed;
  inset: 0;
  z-index: 85;
  background: rgba(0,0,0,.42);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
body.sources-open #sourcesBackdrop{
  opacity: 1;
  pointer-events: auto;
}

/* Controles não dependem mais da largura do painel */
#controls{
  right: 20px !important;
  bottom: 22px !important;
}

/* O painel de detalhes continua separado */
#detailPanel{
  z-index: 80 !important;
}

/* Desktop */
@media (min-width: 701px){
  #rightPanel{--sources-width:360px}
}

/* Mobile */
@media (max-width: 700px){
  #brand{
    top: 14px !important;
    left: 14px !important;
    font-size: 11px !important;
  }
  #utcClock{
    top: 35px !important;
    left: 14px !important;
    font-size: 8px !important;
  }
  #sourcesMenuButton{
    top: 12px;
    right: 12px;
    min-width: 72px;
    height: 36px;
    padding: 0 10px;
    font-size: 8px;
  }
  body.sources-open #sourcesMenuButton{
    right: 12px;
  }

  /* Faixa horizontal abaixo do cabeçalho */
  #topHealth{
    top: 58px !important;
    left: 10px !important;
    right: 10px !important;
    transform: none !important;
    max-width: none !important;
    width: calc(100vw - 20px) !important;
    padding: 5px !important;
  }
  #topHealth .healthChip{
    min-width: 82px !important;
    padding: 6px 8px !important;
  }
  #topHealth .healthName{font-size:7px !important}
  #topHealth .healthState{font-size:8px !important}

  #rightPanel{
    width: min(330px, 88vw) !important;
  }

  #legend{display:none !important}

  #detailPanel{
    left: 10px !important;
    right: 10px !important;
    bottom: 10px !important;
    width: auto !important;
    max-height: 48vh !important;
    overflow-y: auto !important;
  }

  #controls{
    right: 10px !important;
    bottom: 10px !important;
    gap: 5px !important;
  }
  .controlButton{
    width: 38px !important;
    height: 38px !important;
  }

  body.sources-open #controls,
  body.sources-open #detailPanel{
    pointer-events:none;
  }
}
</style>

<script>
const CONFIG = {
  cesiumToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Ik9SejUtTVBrcGwxaG5CQnUiLCJqdGkiOiI4NWYzMzFlNy01ZmVkLTRmOTAtYmY0Yy00ZDFkOGFmOWVmMGIiLCJpZCI6NTEzMzQxLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTA5MTA3MzR9.mj-7IGZrsyhfxVmOoyeBoPT1jHkwrefaqXle4WeQB8c",
  imageryAssetId: 3830183,
  functionsBase: "https://whdymuqmzuwmrsqaqywd.supabase.co/functions/v1",
  radarRefreshMs: 120000,
  healthRefreshMs: 120000,
  radarOkMinutes: 10,
  radarWarnMinutes: 20,
  geoAltitude: 35786000,
  viirsSwathWidth: 3060000
};

Cesium.Ion.defaultAccessToken = CONFIG.cesiumToken;

const $ = id => document.getElementById(id);
const EARTH_RADIUS = 6378137;
const FULL_DISK_ANGLE = Cesium.Math.toRadians(83);
const sources = new Map();
const radarEntities = new Map();
const satelliteEntities = new Map();
let viewer;

function toast(text){
  $("toast").textContent=text; $("toast").classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>$("toast").classList.remove("show"),2200);
}
function updateClock(){
  $("utcClock").textContent=new Date().toISOString().replace("T"," ").replace("Z"," UTC");
}
setInterval(updateClock,1000); updateClock();

function setHealth(id,state,text){
  const el=$(id); el.textContent=text;
  el.className="healthState "+(state==="ok"?"ok":state==="warning"?"warning":state==="error"?"error":"muted");
}
function parseDate(v){
  if(!v)return null;
  const d=new Date(v);
  return Number.isNaN(d.getTime())?null:d;
}
function ageMinutes(date){
  if(!date)return Infinity;
  return Math.max(0,(Date.now()-date.getTime())/60000);
}
function ageText(date){
  if(!date)return "sem timestamp";
  const m=ageMinutes(date);
  if(m<1)return Math.round(m*60)+" s";
  if(m<60)return m.toFixed(1)+" min";
  return (m/60).toFixed(1)+" h";
}
function stateFromDate(date){
  const m=ageMinutes(date);
  if(m<=CONFIG.radarOkMinutes)return "ok";
  if(m<=CONFIG.radarWarnMinutes)return "warning";
  return "error";
}
function stateLabel(s){return s==="ok"?"OK":s==="warning"?"ATRASADO":s==="error"?"STALE":"--"}
function colorForState(s){
  if(s==="ok")return Cesium.Color.fromCssColorString("#78f59a");
  if(s==="warning")return Cesium.Color.fromCssColorString("#ffd36a");
  return Cesium.Color.fromCssColorString("#ff7474");
}
function fmtCoord(n,pos,neg){
  if(!Number.isFinite(n))return "--";
  return Math.abs(n).toFixed(3)+"° "+(n>=0?pos:neg);
}

async function fetchJSON(url, timeout=18000){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),timeout);
  try{
    const r=await fetch(url,{cache:"no-store",signal:ctrl.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function extractArray(data){
  if(Array.isArray(data))return data;
  for(const k of ["images","radars","data","items","results","frames"]){
    if(Array.isArray(data?.[k]))return data[k];
  }
  return [];
}
function newestByRadar(items){
  const map=new Map();
  for(const item of items){
    const name=item.radar||item.name||item.site||item.area||"RADAR";
    const d=parseDate(item.timestamp||item.time||item.datetime||item.updated_at);
    const old=map.get(name);
    const oldD=old?parseDate(old.timestamp||old.time||old.datetime||old.updated_at):null;
    if(!old || (d && (!oldD || d>oldD)))map.set(name,item);
  }
  return [...map.values()];
}

function openDetail(src){
  if(window.innerWidth<=700) setMobilePanel(false);
  $("detailPanel").classList.add("visible");
  $("detailName").textContent=src.name||"--";
  $("detailRole").textContent=src.role||"--";
  $("detailStatus").textContent=(src.stateLabel||stateLabel(src.state))+" • "+(src.origin||"MONI");
  $("detailStatus").className=src.state||"muted";
  $("detailTime").textContent=src.date?src.date.toISOString().replace("T"," ").replace("Z"," UTC"):(src.timeText||"--");
  $("detailAge").textContent=src.date?ageText(src.date):(src.age||"--");
  $("detailPosition").textContent=src.positionText||"--";
  $("detailCoverage").textContent=src.coverageText||"--";
  $("detailProducts").innerHTML=(src.products||[]).map(x=>"• "+x).join("<br>") || "Sem produtos descritos.";
}

function createSourceCard(container,src,onClick){
  const d=document.createElement("div"); d.className="source";
  d.innerHTML=`
    <div class="sourceTop">
      <div><div class="sourceName">${src.name}</div><div class="sourceRole">${src.role||""}</div></div>
      <div class="sourceState ${src.state||"muted"}">${src.stateLabel||stateLabel(src.state)}</div>
    </div>
    <div class="sourceMeta">
      <span>IDADE <strong>${src.date?ageText(src.date):(src.age||"--")}</strong></span>
      <span>ORIGEM <strong>${src.origin||"--"}</strong></span>
    </div>`;
  d.onclick=onClick;
  container.appendChild(d);
  return d;
}

function createGeoCoverage(longitude,color){
  const positions=[];
  const centerLon=Cesium.Math.toRadians(longitude), centerLat=0;
  for(let bearing=0;bearing<=360;bearing+=2){
    const brng=Cesium.Math.toRadians(bearing);
    const lat=Math.asin(Math.sin(centerLat)*Math.cos(FULL_DISK_ANGLE)+Math.cos(centerLat)*Math.sin(FULL_DISK_ANGLE)*Math.cos(brng));
    const lon=centerLon+Math.atan2(Math.sin(brng)*Math.sin(FULL_DISK_ANGLE)*Math.cos(centerLat),Math.cos(FULL_DISK_ANGLE)-Math.sin(centerLat)*Math.sin(lat));
    positions.push(Cesium.Cartesian3.fromRadians(lon,lat,4000));
  }
  return viewer.entities.add({polygon:{
    hierarchy:new Cesium.PolygonHierarchy(positions),
    material:color.withAlpha(.065),outline:true,outlineColor:color.withAlpha(.35),perPositionHeight:true
  }});
}

function addGeo(id,name,lon,color,role,products){
  const pos=Cesium.Cartesian3.fromDegrees(lon,0,CONFIG.geoAltitude);
  const ground=Cesium.Cartesian3.fromDegrees(lon,0,0);
  const entity=viewer.entities.add({
    id:"sat-"+id,position:pos,
    point:{pixelSize:12,color,outlineColor:Cesium.Color.WHITE,outlineWidth:2,disableDepthTestDistance:Number.POSITIVE_INFINITY},
    label:{text:name,font:"600 12px Arial",fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,
      style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(0,-22),disableDepthTestDistance:Number.POSITIVE_INFINITY}
  });
  const nadir=viewer.entities.add({polyline:{positions:[ground,pos],width:1,material:color.withAlpha(.45),arcType:Cesium.ArcType.NONE}});
  const coverage=createGeoCoverage(lon,color);
  const src={id,name,role,state:"ok",stateLabel:"CONFIGURADO",origin:"MONI",positionText:fmtCoord(lon,"E","W")+" / GEO",
    coverageText:"Full Disk visual",products,timeText:"posição orbital nominal",age:"tempo real"};
  entity._moniSource=src;
  satelliteEntities.set(id,{entity,nadir,coverage,src});
  sources.set(id,src);
  return src;
}

async function addLeo(config){
  const url=`https://celestrak.org/NORAD/elements/gp.php?CATNR=${config.norad}&FORMAT=TLE`;
  const text=await (await fetch(url,{cache:"no-store"})).text();
  const lines=text.trim().split(/\r?\n/).map(x=>x.trim());
  const l1=lines.find(x=>x.startsWith("1 ")), l2=lines.find(x=>x.startsWith("2 "));
  if(!l1||!l2)throw new Error("TLE inválido");
  const satrec=satellite.twoline2satrec(l1,l2);

  function propagate(date){
    const pv=satellite.propagate(satrec,date); if(!pv?.position)return null;
    const geo=satellite.eciToGeodetic(pv.position,satellite.gstime(date));
    const lat=satellite.degreesLat(geo.latitude),lon=satellite.degreesLong(geo.longitude),alt=geo.height*1000;
    return {lat,lon,alt,position:Cesium.Cartesian3.fromDegrees(lon,lat,alt)};
  }
  const cur=propagate(new Date()); if(!cur)throw new Error("Falha SGP4");
  const entity=viewer.entities.add({
    id:"sat-"+config.id,position:cur.position,
    point:{pixelSize:10,color:config.color,outlineColor:Cesium.Color.WHITE,outlineWidth:2,disableDepthTestDistance:Number.POSITIVE_INFINITY},
    label:{text:config.name,font:"600 11px Arial",fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,
      style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(0,-21),disableDepthTestDistance:Number.POSITIVE_INFINITY}
  });
  const ground=Cesium.Cartesian3.fromDegrees(cur.lon,cur.lat,0);
  const swath=viewer.entities.add({position:ground,ellipse:{
    semiMajorAxis:CONFIG.viirsSwathWidth/2,semiMinorAxis:90000,
    material:config.color.withAlpha(.09),outline:true,outlineColor:config.color.withAlpha(.42),height:4000
  }});
  const past=[],future=[],now=new Date();
  for(let min=-55;min<=55;min+=2){
    const p=propagate(new Date(now.getTime()+min*60000)); if(!p)continue;
    (min<=0?past:future).push(p.position);
  }
  const pastTrack=viewer.entities.add({polyline:{positions:past,width:1.2,material:config.color.withAlpha(.22),arcType:Cesium.ArcType.NONE}});
  const futureTrack=viewer.entities.add({polyline:{positions:future,width:1.2,material:config.color.withAlpha(.68),arcType:Cesium.ArcType.NONE}});
  const src={id:config.id,name:config.name,role:`VIIRS • NORAD ${config.norad}`,state:"ok",stateLabel:"SGP4",
    origin:"CELESTRAK",positionText:`${fmtCoord(cur.lat,"N","S")} / ${fmtCoord(cur.lon,"E","W")}`,
    coverageText:"VIIRS ~3060 km (visual)",products:["VIIRS","órbita SGP4","swath visual"],age:"TLE atual"};
  entity._moniSource=src;
  satelliteEntities.set(config.id,{entity,swath,pastTrack,futureTrack,satrec,propagate,src});
  sources.set(config.id,src);
}

function renderSatelliteCards(){
  const c=$("satelliteList"); c.innerHTML="";
  for(const obj of satelliteEntities.values()){
    createSourceCard(c,obj.src,()=>{
      openDetail(obj.src);
      viewer.flyTo(obj.entity,{duration:1.4,offset:new Cesium.HeadingPitchRange(0,-.45,obj.src.id.startsWith("goes")?7000000:2500000)});
    });
  }
}

function updateLeoPositions(){
  for(const obj of satelliteEntities.values()){
    if(!obj.propagate)continue;
    const p=obj.propagate(new Date()); if(!p)continue;
    obj.entity.position=p.position;
    obj.swath.position=Cesium.Cartesian3.fromDegrees(p.lon,p.lat,0);
    obj.src.positionText=`${fmtCoord(p.lat,"N","S")} / ${fmtCoord(p.lon,"E","W")}`;
  }
}

function radarCenter(item){
  if(Number.isFinite(item?.center?.lat)&&Number.isFinite(item?.center?.lon))return item.center;
  const b=item?.bounds;
  if(b && [b.south,b.west,b.north,b.east].every(Number.isFinite))
    return {lat:(b.south+b.north)/2,lon:(b.west+b.east)/2};
  return null;
}
function radarRadius(item,center){
  if(Number.isFinite(item.radius_km))return item.radius_km;
  const b=item.bounds;
  if(!b||!center)return null;
  const dy=Math.abs(b.north-b.south)*111/2;
  const dx=Math.abs(b.east-b.west)*111*Math.cos(center.lat*Math.PI/180)/2;
  return Math.max(dx,dy);
}

function clearRadars(){
  for(const o of radarEntities.values()){
    viewer.entities.remove(o.entity); if(o.coverage)viewer.entities.remove(o.coverage);
  }
  radarEntities.clear();
}

async function refreshRadars(){
  setHealth("healthRadar","muted","CHECK");
  try{
    const data=await fetchJSON(CONFIG.functionsBase+"/radar");
    const all=extractArray(data), items=newestByRadar(all);
    clearRadars();
    const list=$("radarList"); list.innerHTML="";
    let ok=0,warn=0,bad=0;

    for(const item of items){
      const center=radarCenter(item); if(!center)continue;
      const date=parseDate(item.timestamp||item.time||item.datetime||item.updated_at);
      const state=stateFromDate(date);
      if(state==="ok")ok++; else if(state==="warning")warn++; else bad++;
      const radius=radarRadius(item,center);
      const name=item.radar||item.name||item.site||item.area||"RADAR";
      const area=item.area||"--";
      const color=colorForState(state);

      const entity=viewer.entities.add({
        id:"radar-"+name+"-"+area,
        position:Cesium.Cartesian3.fromDegrees(center.lon,center.lat,1000),
        point:{pixelSize:11,color,outlineColor:Cesium.Color.WHITE,outlineWidth:2,disableDepthTestDistance:Number.POSITIVE_INFINITY},
        label:{text:name,font:"600 10px Arial",fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,
          style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(0,-20),disableDepthTestDistance:Number.POSITIVE_INFINITY,
          distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,12000000)}
      });
      let coverage=null;
      if(radius){
        coverage=viewer.entities.add({
          position:Cesium.Cartesian3.fromDegrees(center.lon,center.lat,0),
          ellipse:{semiMajorAxis:radius*1000,semiMinorAxis:radius*1000,material:color.withAlpha(.055),
            outline:true,outlineColor:color.withAlpha(.38),height:2500}
        });
      }
      const src={
        name,role:`MAXCAPPI • área ${area}`,state,stateLabel:stateLabel(state),origin:"REDEMET → MONI",date,
        positionText:`${fmtCoord(center.lat,"N","S")} / ${fmtCoord(center.lon,"E","W")}`,
        coverageText:radius?`${radius.toFixed(0)} km`:"bounds MONI",
        products:["MAXCAPPI","detecção de células","núcleos convectivos","merge multirradar","entrada do Hail Engine"]
      };
      entity._moniSource=src;
      radarEntities.set(name+"-"+area,{entity,coverage,src});
      createSourceCard(list,src,()=>{
        openDetail(src);
        viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(center.lon,center.lat,Math.max(650000,(radius||250)*3500)),duration:1.3});
      });
    }

    if(!radarEntities.size){
      list.innerHTML='<div class="source"><div class="sourceRole">A API respondeu, mas nenhum radar com center/bounds pôde ser desenhado.</div></div>';
    }
    setHealth("healthRadar",bad?"warning":"ok",`${radarEntities.size} RADARES`);
    $("panelSummary").textContent=`${satelliteEntities.size} satélites • ${radarEntities.size} radares • atualização ${new Date().toLocaleTimeString("pt-BR")}`;
  }catch(e){
    console.error("Radar:",e);
    setHealth("healthRadar","error","ERRO");
    $("radarList").innerHTML=`<div class="source"><div class="sourceState error">API INDISPONÍVEL</div><div class="sourceRole">${e.message}</div></div>`;
  }
}

function newestTimestampDeep(data){
  let newest=null;
  const visit=v=>{
    if(v==null)return;
    if(typeof v==="string"){
      const d=parseDate(v); if(d && d.getFullYear()>2020 && (!newest||d>newest))newest=d;
    } else if(Array.isArray(v)) v.slice(0,5000).forEach(visit);
    else if(typeof v==="object"){
      for(const [k,val] of Object.entries(v)){
        if(/time|date|timestamp|updated|generated/i.test(k))visit(val);
      }
    }
  };
  visit(data); return newest;
}
async function checkEndpoint(path,healthId,label){
  try{
    const data=await fetchJSON(CONFIG.functionsBase+path,22000);
    const d=newestTimestampDeep(data);
    const s=d?stateFromDate(d):"ok";
    setHealth(healthId,s,s==="ok"?"ONLINE":stateLabel(s));
    return {ok:true,data,date:d};
  }catch(e){
    console.error(label,e); setHealth(healthId,"error","ERRO"); return {ok:false,error:e};
  }
}
async function refreshHealth(){
  await Promise.allSettled([
    checkEndpoint("/glm?minutes=15","healthGlm","GLM"),
    checkEndpoint("/hail","healthHail","HAIL"),
    checkEndpoint("/maxcappi-analyze","healthMax","MAXCAPPI")
  ]);
}

async function start(){
  try{
    viewer=new Cesium.Viewer("cesiumContainer",{
      animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,
      sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,
      selectionIndicator:false,baseLayer:false,
      terrain:Cesium.Terrain.fromWorldTerrain({requestVertexNormals:true,requestWaterMask:true})
    });
    window.viewer=viewer;

    const imagery=Cesium.ImageryLayer.fromProviderAsync(Cesium.IonImageryProvider.fromAssetId(CONFIG.imageryAssetId));
    viewer.imageryLayers.add(imagery);
    viewer.resolutionScale=Math.min(window.devicePixelRatio||1,2);
    viewer.scene.globe.maximumScreenSpaceError=1;
    viewer.scene.globe.tileCacheSize=1000;
    viewer.scene.globe.preloadAncestors=true;
    viewer.scene.globe.preloadSiblings=true;
    viewer.scene.postProcessStages.fxaa.enabled=true;
    viewer.scene.globe.depthTestAgainstTerrain=true;
    viewer.scene.skyAtmosphere.show=true;
    viewer.scene.globe.showGroundAtmosphere=true;
    viewer.scene.globe.enableLighting=true;
    viewer.scene.globe.dynamicAtmosphereLighting=true;
    viewer.scene.globe.dynamicAtmosphereLightingFromSun=true;
    viewer.scene.screenSpaceCameraController.minimumZoomDistance=5;
    viewer.scene.screenSpaceCameraController.maximumZoomDistance=120000000;

    addGeo("goes19","GOES-19",-75.2,Cesium.Color.fromCssColorString("#48a5ff"),"GOES EAST • ABI / GLM",
      ["ABI","GLM","monitoramento continental","entrada de atividade elétrica"]);
    addGeo("goes18","GOES-18",-137.0,Cesium.Color.fromCssColorString("#a86cff"),"GOES WEST • ABI / GLM",
      ["ABI","GLM","cobertura complementar"]);
    addGeo("goes16","GOES-16",-104.7,Cesium.Color.fromCssColorString("#7d8b9e"),"STORAGE / BACKUP • ABI / GLM",
      ["ABI","GLM","backup / histórico"]);

    let leoLoaded=0;
    const leos=[
      {id:"noaa21",name:"NOAA-21",norad:54234,color:Cesium.Color.fromCssColorString("#44e6b1")},
      {id:"noaa20",name:"NOAA-20",norad:43013,color:Cesium.Color.fromCssColorString("#ffbd4a")},
      {id:"snpp",name:"SUOMI NPP",norad:37849,color:Cesium.Color.fromCssColorString("#ff668a")}
    ];
    for(const c of leos){
      try{await addLeo(c);leoLoaded++;}catch(e){console.error(c.name,e)}
    }
    setHealth("healthOrbit",leoLoaded===leos.length?"ok":leoLoaded?"warning":"error",`${leoLoaded}/${leos.length} SGP4`);
    renderSatelliteCards();

    viewer.camera.setView({
      destination:Cesium.Cartesian3.fromDegrees(-65,-15,26000000),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(-90),roll:0}
    });

    const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(m=>{
      const picked=viewer.scene.pick(m.position);
      const src=picked?.id?._moniSource;
      if(src)openDetail(src);
    },Cesium.ScreenSpaceEventType.LEFT_CLICK);

    $("zoomIn").onclick=()=>viewer.camera.zoomIn(Math.max(viewer.camera.positionCartographic.height*.35,100));
    $("zoomOut").onclick=()=>viewer.camera.zoomOut(Math.max(viewer.camera.positionCartographic.height*.45,100));
    $("home").onclick=()=>viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(-65,-15,26000000),duration:1.2});
    $("refresh").onclick=async()=>{toast("Atualizando diagnóstico MONI...");await Promise.allSettled([refreshRadars(),refreshHealth()]);toast("Diagnóstico atualizado.");};

    await Promise.allSettled([refreshRadars(),refreshHealth()]);
    setInterval(refreshRadars,CONFIG.radarRefreshMs);
    setInterval(refreshHealth,CONFIG.healthRefreshMs);
    setInterval(updateLeoPositions,1000);

    console.log("MONI Earth Debug iniciado.");
  }catch(e){
    console.error("MONI Earth Debug:",e);
    setHealth("healthOrbit","error","CESIUM ERRO");
    toast("Erro ao iniciar. Veja o console do navegador.");
  }
}
start();
</script>

<script id="moni-standard-layout-js">
(function(){
  const btn = document.getElementById("sourcesMenuButton");
  const backdrop = document.getElementById("sourcesBackdrop");
  const panel = document.getElementById("rightPanel");
  if(!btn || !panel) return;

  function setOpen(open){
    document.body.classList.toggle("sources-open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.textContent = open ? "FECHAR ×" : "FONTES ☰";
  }

  btn.addEventListener("click", function(){
    setOpen(!document.body.classList.contains("sources-open"));
  });

  if(backdrop) backdrop.addEventListener("click", function(){ setOpen(false); });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") setOpen(false);
  });

  /* Selecionou uma fonte: libera o globo e mostra o detalhe */
  panel.addEventListener("click", function(e){
    if(e.target.closest(".source")){
      window.setTimeout(function(){ setOpen(false); }, 80);
    }
  });

  /* Começa fechado tanto no PC quanto no celular */
  setOpen(false);
})();
</script>


<script id="moni-layout-refinement-v2-js">
(function(){
  function installInternalClose(){
    const panel = document.getElementById("rightPanel");
    if(!panel || document.getElementById("sourcesCloseButton")) return;

    const header = panel.querySelector(".panelHeader");
    if(!header) return;

    const title = header.querySelector(".panelTitle");
    const sub = header.querySelector(".panelSub");

    const top = document.createElement("div");
    top.className = "panelHeaderTop";

    const textWrap = document.createElement("div");
    textWrap.style.minWidth = "0";
    textWrap.style.flex = "1";

    if(title) textWrap.appendChild(title);
    if(sub) textWrap.appendChild(sub);

    const close = document.createElement("button");
    close.id = "sourcesCloseButton";
    close.type = "button";
    close.setAttribute("aria-label","Fechar fontes");
    close.textContent = "×";

    top.appendChild(textWrap);
    top.appendChild(close);
    header.appendChild(top);

    close.addEventListener("click", function(){
      document.body.classList.remove("sources-open");
      const opener = document.getElementById("sourcesMenuButton");
      if(opener){
        opener.setAttribute("aria-expanded","false");
        opener.textContent = "FONTES ☰";
      }
    });
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", installInternalClose);
  }else{
    installInternalClose();
  }
})();
</script>
